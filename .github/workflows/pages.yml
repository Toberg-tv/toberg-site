name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Show Pages base path
        run: echo "Pages base_path='${{ steps.pages.outputs.base_path }}'"

      - name: Build
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - name: Verify built URLs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = process.env.PATH_PREFIX || '/';
          const prefix = raw.endsWith('/') ? raw : raw + '/';
          const expected = `href="${prefix}assets/css/style.css"`;
          const html = fs.readFileSync('_site/index.html', 'utf8');
          if (!html.includes(expected)) {
            console.error('Expected ' + expected + ' in _site/index.html');
            process.exit(1);
          }
          console.log('Verified ' + expected);
          NODE
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
